# See the "Docker" section of the README for the full steps. In short:
#   1. cp configuration/<name>.example.json configuration/<name>.json  (buildings,
#      categories, vlans, devices) and edit them for your site
#   2. cp .env.example .env, add the login hash and your credential variables
#   3. docker compose up -d --build
# Reload configuration/ later with: docker compose run --rm switchgopher -seed
services:
  switchgopher:
    build: .
    image: switchgopher
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - data:/data
      - ./configuration:/app/configuration
      - configs:/app/resources/configs
volumes:
  data:
  configs:
